name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'refactor/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.9'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --python python
      - run: uv run --locked python -m ruff check app tests
      - run: uv run --locked python -m ruff format --check app tests
      - run: uv run --locked python -m mypy app
      - run: uv run --locked python -m bandit -c pyproject.toml -r app
      - run: uv pip check
      - name: Audit locked Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          uv export --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          uv run --locked python -m pip_audit -r "$RUNNER_TEMP/runtime-requirements.txt" --no-deps --disable-pip
      - name: Audit locked dependencies including development tools
        run: |
          uv export --locked --all-groups --no-emit-project --output-file "${{ runner.temp }}/all-requirements.txt"
          uv run --locked python -m pip_audit -r "${{ runner.temp }}/all-requirements.txt" --no-deps --disable-pip
      - run: uv run --locked python -m pytest --cov-report=xml --cov-fail-under=80
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  scheduled-audit:
    if: github.event_name == 'schedule'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.9'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --python python
      - name: Audit locked runtime and development dependencies
        run: |
          uv export --locked --all-groups --no-emit-project --output-file "${{ runner.temp }}/all-requirements.txt"
          uv run --locked python -m pip_audit -r "${{ runner.temp }}/all-requirements.txt" --no-deps --disable-pip

  renderer-containers:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [test, qt-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --target ${{ matrix.target }} -t labels-test .
      - run: docker run --rm --cpus 4 --memory 2g labels-test pytest --cov-report=xml --cov-fail-under=80

  runtime-smoke:
    needs: renderer-containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t labels-runtime .
      - name: Generate, download and gracefully stop
        run: |
          docker run -d --name labels-ci-runtime --cpus 2 --memory 1g -e MAX_LABELS_PER_BATCH=2 -p 127.0.0.1:18000:8000 labels-runtime
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18000/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/ready
          docker cp tests/fixtures/gtk.glabels labels-ci-runtime:/app/templates/demo.glabels
          python tests/runtime_smoke.py http://127.0.0.1:18000
          docker stop --time 60 labels-ci-runtime
          test "$(docker inspect --format '{{.State.ExitCode}}' labels-ci-runtime)" = 0
      - name: Logs and teardown
        if: always()
        run: |
          docker logs labels-ci-runtime || true
          docker rm -f labels-ci-runtime || true
