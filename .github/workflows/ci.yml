name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'refactor/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.8'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m ruff format --check app tests
      - run: python -m mypy app
      - run: python -m bandit -c pyproject.toml -r app
      - run: python -m pip check
      - name: Audit pinned Linux runtime dependencies
        if: runner.os == 'Linux'
        run: python -m pip_audit -r constraints-linux.txt --no-deps --disable-pip
      - run: python -m pytest --cov-report=xml
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  renderer-containers:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [test, qt-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --target ${{ matrix.target }} -t labels-test .
      - run: docker run --rm --cpus 4 --memory 2g labels-test pytest --cov-report=xml

  runtime-smoke:
    needs: renderer-containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t labels-runtime .
      - name: Readiness and graceful stop
        run: |
          docker run -d --name labels-ci-runtime --cpus 2 --memory 1g -p 127.0.0.1:18000:8000 labels-runtime
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18000/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/ready
          docker stop --time 60 labels-ci-runtime
          test "$(docker inspect --format '{{.State.ExitCode}}' labels-ci-runtime)" = 0
      - name: Logs and teardown
        if: always()
        run: |
          docker logs labels-ci-runtime || true
          docker rm -f labels-ci-runtime || true
