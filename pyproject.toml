# pyproject.toml
# Project metadata, dependencies, and tool configuration.
# Commit uv.lock with dependency changes; do not edit it by hand.

[project]
name = "glabels-batch-service"
version = "3.0.0"
description = "FastAPI microservice for batch label printing using gLabels"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.54.0",
    "loguru==0.7.3",
    "slowapi==0.1.10",
    "prometheus-client==0.26.0",
    "pikepdf==10.16.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "mypy==2.4.0",
    "ruff==0.17.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[tool.uv]
required-version = "==0.12.10"
package = false

# =============================================================================
# Ruff - Linter & Formatter
# =============================================================================
[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line-too-long (let IDE/formatter handle this)
    "B904",  # raise-without-from (acceptable for API error conversion)
    "B008",  # function-call-in-default (standard in FastAPI with Body())
]

# =============================================================================
# Mypy - Type Checking
# =============================================================================
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
strict = true
no_implicit_reexport = true
warn_return_any = true
warn_unused_configs = true

# =============================================================================
# Pytest - Testing
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
addopts = [
    "-v",
    "--cov=app",
    "--cov-report=term-missing",
]

# =============================================================================
# Coverage - Report Settings
# =============================================================================
[tool.coverage.run]
source = ["app"]
omit = ["app/__pycache__/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

# =============================================================================
# Bandit - Security Scanning
# =============================================================================
[tool.bandit]
targets = ["app"]
severity = "LOW"      # -ll equivalent: report LOW and above
confidence = "LOW"
